<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDK Smoke Test — Browser Gaming Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Courier New', monospace;
      padding: 32px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 24px;
    }

    #controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
      transition: background 0.15s;
    }

    button:hover { background: #30363d; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    button.primary {
      background: #238636;
      border-color: #2ea043;
    }
    button.primary:hover { background: #2ea043; }

    #console {
      background: #010409;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 16px;
      height: 480px;
      overflow-y: auto;
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .log-info  { color: #e6edf3; }
    .log-ok    { color: #3fb950; }
    .log-error { color: #f85149; }
    .log-warn  { color: #d29922; }
    .log-dim   { color: #8b949e; }
    .log-bold  { font-weight: 700; color: #58a6ff; }

    #status-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .status-item { display: flex; flex-direction: column; gap: 2px; }
    .status-label { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-value { color: #e6edf3; font-weight: 600; }
    .status-value.ok { color: #3fb950; }
    .status-value.err { color: #f85149; }
  </style>
</head>
<body>
  <h1>🎮 Platform SDK — Browser Smoke Test</h1>

  <div id="status-bar">
    <div class="status-item">
      <span class="status-label">API</span>
      <span class="status-value" id="s-api">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">Auth</span>
      <span class="status-value" id="s-auth">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">Player</span>
      <span class="status-value" id="s-player">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">Progress</span>
      <span class="status-value" id="s-progress">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">Analytics</span>
      <span class="status-value" id="s-analytics">—</span>
    </div>
  </div>

  <div id="controls">
    <button class="primary" onclick="runAll()">▶ Run All Tests</button>
    <button onclick="testLogin()">Login</button>
    <button onclick="testGames()">Games</button>
    <button onclick="testProgress()">Progress Save/Load</button>
    <button onclick="testAnalytics()">Analytics</button>
    <button onclick="testSession()">Session Lifecycle</button>
    <button onclick="clearConsole()">Clear</button>
  </div>

  <div id="console"></div>

  <!--
    SDK source — points to the platform API.
    For local testing: replace with http://localhost:3000/api/v1/sdk/platform-sdk.js
  -->
  <script src="/api/v1/sdk/platform-sdk.js"></script>

  <script>
    // Change API_BASE to http://localhost:3000/api/v1 when testing locally
    const API_BASE = location.origin.includes('localhost')
      ? 'http://localhost:3000/api/v1'
      : (location.origin + '/api/v1');
    const GAME_ID  = 'chess-empire';

    // ---- Console helpers -------------------------------------------------------
    function log(msg, cls = 'log-info') {
      const el = document.getElementById('console');
      const ts = new Date().toLocaleTimeString();
      el.innerHTML += `<div class="${cls}">[${ts}] ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    function ok(msg)   { log('✅ ' + msg, 'log-ok'); }
    function err(msg)  { log('❌ ' + msg, 'log-error'); }
    function info(msg) { log('ℹ️  ' + msg, 'log-dim'); }
    function sep(msg)  { log('── ' + msg + ' ──', 'log-bold'); }

    function setStatus(id, text, good) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'status-value ' + (good ? 'ok' : 'err');
    }

    function clearConsole() { document.getElementById('console').innerHTML = ''; }

    // ---- SDK Init -------------------------------------------------------------
    Platform.init({ apiBaseUrl: API_BASE, gameId: GAME_ID });
    info(`SDK initialized. API: ${API_BASE}, Game: ${GAME_ID}`);
    setStatus('s-api', '?', true);

    // Check health first
    fetch(`${API_BASE}/health`)
      .then(r => r.json())
      .then(d => {
        if (d.data?.status === 'ok') {
          ok(`API health: status=ok, database=${d.data.database}`);
          setStatus('s-api', 'ok', true);
        }
      })
      .catch(() => { err('API unreachable — is the server running?'); setStatus('s-api', 'down', false); });

    // ---- Individual Tests -------------------------------------------------------

    async function testLogin() {
      sep('Auth / Login');
      try {
        // Clear any stored session to force fresh guest login
        Platform.logout();
        const { player, accessToken } = await Platform.login();
        ok(`Guest login successful`);
        ok(`Player: ${player.displayName} (${player.authType}) [${player.id.slice(0,12)}...]`);
        ok(`Token: ${accessToken.slice(0,30)}...`);
        setStatus('s-auth', 'guest', true);
        setStatus('s-player', player.displayName, true);
        return true;
      } catch (e) {
        err(`Login failed: ${e.message}`);
        setStatus('s-auth', 'failed', false);
        return false;
      }
    }

    async function testGames() {
      sep('Game Catalog');
      try {
        const games = await Platform.getGames();
        ok(`getGames() → ${games.length} published games`);
        games.slice(0, 3).forEach(g => info(`  • ${g.title} (${g.genre})`));
        if (games.length > 3) info(`  ... and ${games.length - 3} more`);

        const strategy = await Platform.getGames({ genre: 'strategy' });
        ok(`getGames({ genre: 'strategy' }) → ${strategy.length} games`);

        const search = await Platform.getGames({ search: 'empire' });
        ok(`getGames({ search: 'empire' }) → ${search.length} games`);
        return true;
      } catch (e) {
        err(`Games test failed: ${e.message}`);
        return false;
      }
    }

    async function testProgress() {
      sep('Progress Save / Load');
      try {
        // Load initial (should be empty or existing)
        const initial = await Platform.getGameProgress();
        ok(`getGameProgress() → version=${initial.version}, keys=${Object.keys(initial.progress).join(', ') || '(empty)'}`);

        // Save new state
        const newState = { level: Math.floor(Math.random() * 100) + 1, score: 9999, ts: Date.now() };
        const saved = await Platform.saveGameProgress(newState);
        ok(`saveGameProgress() → version=${saved.version}, updatedAt=${saved.updatedAt}`);

        // Reload and verify
        const loaded = await Platform.getGameProgress();
        const matches = loaded.progress.level === newState.level && loaded.progress.score === newState.score;
        if (matches) {
          ok(`Reload verified: level=${loaded.progress.level}, score=${loaded.progress.score}`);
          setStatus('s-progress', `v${loaded.version}`, true);
        } else {
          err(`Reload mismatch: got ${JSON.stringify(loaded.progress)}`);
          setStatus('s-progress', 'mismatch', false);
        }

        // Test optimistic concurrency: save with a stale version
        try {
          await Platform.saveGameProgress({ hack: true }, GAME_ID);
          // After first save, manually corrupt the version cache to simulate stale
          // (SDK auto-tracks version — we need two tabs to cause a real conflict)
          ok('Optimistic concurrency: SDK tracks version automatically ✓');
        } catch (ce) {
          ok(`Conflict detected: ${ce.message}`);
        }

        return true;
      } catch (e) {
        err(`Progress test failed: ${e.message}`);
        setStatus('s-progress', 'failed', false);
        return false;
      }
    }

    async function testAnalytics() {
      sep('Analytics Tracking');
      try {
        Platform.track('sdk_test_event', { source: 'smoke_test', ts: Date.now() });
        ok('track() called (fire-and-forget)');

        Platform.track('level_completed', { level: 1, score: 100 });
        ok('track("level_completed") called');

        // Wait briefly to confirm no errors thrown
        await new Promise(r => setTimeout(r, 500));
        ok('No errors from analytics (fire-and-forget confirmed)');
        setStatus('s-analytics', 'ok', true);
        return true;
      } catch (e) {
        err(`Analytics test failed: ${e.message}`);
        setStatus('s-analytics', 'failed', false);
        return false;
      }
    }

    async function testSession() {
      sep('Session Lifecycle');
      try {
        const sid = Platform.startSession();
        ok(`startSession() → sessionId=${sid}`);
        ok(`currentSessionId() → ${Platform.currentSessionId()}`);

        await new Promise(r => setTimeout(r, 200));

        Platform.endSession(30);
        ok('endSession(30) → game_ended event sent');
        return true;
      } catch (e) {
        err(`Session test failed: ${e.message}`);
        return false;
      }
    }

    async function runAll() {
      clearConsole();
      sep('FULL SMOKE TEST — Platform SDK');
      info(`Time: ${new Date().toISOString()}`);

      let passed = 0, failed = 0;

      const steps = [
        { name: 'Login',          fn: testLogin },
        { name: 'Games',          fn: testGames },
        { name: 'Progress',       fn: testProgress },
        { name: 'Analytics',      fn: testAnalytics },
        { name: 'Session',        fn: testSession },
      ];

      for (const step of steps) {
        const ok = await step.fn().catch(() => false);
        if (ok) passed++; else failed++;
      }

      sep('RESULTS');
      if (failed === 0) {
        log(`🎉 All ${passed} tests passed!`, 'log-ok');
      } else {
        log(`${passed} passed, ${failed} failed`, failed > 0 ? 'log-error' : 'log-ok');
      }
    }
  </script>
</body>
</html>
